# Copiar al pipeline de cada repo que publica imagen (después de `trivy image`).
# El dashboard lee el artefacto `trivy` / `trivy-report.json` del último build exitoso.
#
# - script: |
#     trivy image --format json --output $(Build.ArtifactStagingDirectory)/trivy-report.json $(imageName)
#   displayName: Trivy JSON for dashboard
# - task: PublishPipelineArtifact@1
#   inputs:
#     targetPath: $(Build.ArtifactStagingDirectory)/trivy-report.json
#     artifact: trivy

steps:
  - script: |
      trivy image --format json --output $(Build.ArtifactStagingDirectory)/trivy-report.json $(imageName)
    displayName: Trivy JSON for dashboard
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/trivy-report.json
      artifact: trivy
