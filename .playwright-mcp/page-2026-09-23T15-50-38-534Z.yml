          - paragraph [ref=f1e326]: "Ordenada por deuda cada 1.000 líneas. La normalización por tamaño es deliberada: sin ella, los proyectos grandes como Probatch quedan siempre últimos y la conversación con los líderes se desvía. Los proyectos sin adopción quedan siempre al final."
      - generic [ref=f1e327]:
        - generic [ref=f1e328]:
          - heading "Cómo leer esta tabla" [level=2] [ref=f1e330]
          - list [ref=f1e332]:
            - listitem [ref=f1e333]:
              - strong [ref=f1e334]: Deuda / 1k líneas
              - text: = minutos de
              - code [ref=f1e335]: sqale_index
              - text: cada 1.000 líneas, y es el orden por defecto. Permite comparar Probatch (35 repos) con Afrodita (5 repos) sin que el tamaño domine el ranking. La deuda total usa jornadas de 8 h.
            - listitem [ref=f1e336]:
              - strong [ref=f1e337]: Adopción
              - text: = repos con proyecto en SonarQube sobre el total de repos que Azure DevOps reporta para ese proyecto. Es el indicador de avance del plan.
            - listitem [ref=f1e338]:
              - strong [ref=f1e339]: Actividad
              - text: = repos analizados en cada uno de los últimos scans. Una línea plana en cero es un proyecto que todavía no arrancó.
            - listitem [ref=f1e340]:
              - strong [ref=f1e341]: Críticos Trivy
              - text: = CVE de severidad crítica en las imágenes de contenedor del proyecto, sumados por repo.
            - listitem [ref=f1e342]: Los nombres van siempre completos. Hacer clic en el nombre abre el detalle con el desglose por repo.
