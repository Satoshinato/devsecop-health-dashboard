trigger:
  branches:
    include:
      - main

schedules:
  - cron: "0 6 * * *"
    displayName: Scan diario
    branches:
      include:
        - main
    always: true

# ubuntu-latest no llega a sonarqube.shared.accusys.com.ar (IPs 10.x).
# Para métricas Sonar reales, cambiar a un self-hosted agent de la red Accusys:
#   pool:
#     name: <nombre-del-agent-pool>
pool:
  vmImage: ubuntu-latest

variables:
  - group: devsecops-dashboard
  - name: SONAR_HOST
    value: https://sonarqube.shared.accusys.com.ar
  - name: imageName
    value: accusystechnology.azurecr.io/devsecops-dashboard

stages:
  - stage: ScanAndBuild
    jobs:
      - job: scan_build_image
        displayName: Colector, export estático e imagen nginx
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"

          - script: npm ci
            displayName: npm ci

          - script: |
              echo "Hosted agent no llega a Sonar interno. Se usa data/scans versionado (scan local)."
              echo "Cuando el job corra en un pool Accusys On-Prem/Shared, reemplazar este step por: npx tsx collector/main.ts"
            displayName: Usar snapshot versionado (Sonar local)

          - script: npm test
            displayName: Tests de métricas

          - script: npm run build
            displayName: next build (export)

          - task: Docker@2
            displayName: Docker build nginx que sirve out/
            inputs:
              command: build
              Dockerfile: Dockerfile
              repository: $(imageName)
              tags: |
                $(Build.BuildId)
                latest
